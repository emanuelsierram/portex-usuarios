spring.datasource.initialization-mode=always
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.type=com.zaxxer.hikari.HikariDataSource
spring.datasource.jdbcUrl=jdbc:mysql://localhost:3306/portafolio?createDatabaseIfNotExist=true&allowMultiQueries=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.poolName=pool-usuarios

logging.level.org.springframework.security=DEBUG
spring.profiles.active=desarrollo
server.port=8081
app.jwt.secret=${JWT_SECRET:change-this-secret-in-development}
